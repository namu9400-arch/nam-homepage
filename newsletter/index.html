<style>
/* Layout: 왼쪽 정렬 단일 칼럼(최대 1080px). 첫 화면은 이름과 질문 하나, 이후 "전공 → 경험 → 직무"의 연결선을 따라 내려가는 구성 */
:root {
  --bg: #F6F7FB;
  --fg: #141B34;
  --accent: #2747D6;
  --surface: #FFFFFF;
  --muted: rgba(20, 27, 52, 0.64);
  --line: rgba(20, 27, 52, 0.12);
  --accent-soft: rgba(39, 71, 214, 0.08);
  --on-accent: #FFFFFF;

  --font-title: 'Black Han Sans', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;

  --t-title: 40px; --t-sub: 24px; --t-body: 16px; --t-label: 13px;
  --r-btn: 10px; --r-card: 16px;
  --shadow: 0 1px 2px rgba(20, 27, 52, 0.04), 0 4px 16px rgba(20, 27, 52, 0.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1324; --fg: #E7EAF4; --accent: #7D95FF; --surface: #161C33;
    --muted: rgba(231, 234, 244, 0.68); --line: rgba(231, 234, 244, 0.12);
    --accent-soft: rgba(125, 149, 255, 0.12); --on-accent: #0E1324;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1324; --fg: #E7EAF4; --accent: #7D95FF; --surface: #161C33;
  --muted: rgba(231, 234, 244, 0.68); --line: rgba(231, 234, 244, 0.12);
  --accent-soft: rgba(125, 149, 255, 0.12); --on-accent: #0E1324;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.25);
  color-scheme: dark;
}
@media (max-width: 640px) { :root { --t-title: 30px; --t-sub: 20px; } }

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font: 400 var(--t-body)/1.7 var(--font-body);
  padding-inline: 20px; padding-block: 0;
  word-break: keep-all; overflow-wrap: break-word;
}
.wrap { max-width: 1080px; margin: 0 auto; }
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

h1, .title { font-family: var(--font-title); font-weight: 400; letter-spacing: -0.01em; line-height: 1.25; text-wrap: balance; margin: 0; }
h2 { font: 700 var(--t-sub)/1.4 var(--font-body); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
h3 { font: 700 18px/1.45 var(--font-body); margin: 0; }
p { margin: 0; }
.label { font: 500 var(--t-label)/1.4 var(--font-body); letter-spacing: 0.04em; color: var(--muted); }
.muted { color: var(--muted); }
.prose { max-width: 680px; display: grid; gap: 12px; }

/* Header */
.top { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-block: 20px; border-bottom: 1px solid var(--line); }
.brand { font: 700 15px/1 var(--font-body); color: var(--fg); text-decoration: none; }
.nav { display: flex; gap: 20px; flex-wrap: wrap; }
.nav a { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; }
.nav a:hover { color: var(--fg); }
@media (max-width: 640px) { .nav { display: none; } }

section { padding-block: 72px; border-bottom: 1px solid var(--line); }
section:last-of-type { border-bottom: 0; }
.head { display: grid; gap: 10px; margin-bottom: 32px; max-width: 680px; }

/* Hero */
.hero { padding-block: 80px 72px; display: grid; gap: 28px; }
.hero h1 { font-size: clamp(44px, 9vw, 84px); }
.hero .lead { font-size: 18px; max-width: 620px; }
.hero .lead strong { font-weight: 500; color: var(--fg); }
.actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.btn {
  display: inline-flex; align-items: center; height: 44px; padding: 0 24px;
  border-radius: var(--r-btn); border: 1px solid transparent;
  font: 500 15px/1 var(--font-body); text-decoration: none; cursor: pointer;
}
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-secondary { background: transparent; color: var(--fg); border-color: var(--line); }
.btn:hover { filter: brightness(0.94); }

/* 연결선: 전공 → 경험 → 직무 */
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 8px; }
.node { padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; font: 500 14px/1 var(--font-body); background: var(--surface); }
.node.end { border-color: var(--accent); color: var(--accent); }
.arrow { color: var(--muted); font-size: 14px; }

/* 질문 */
.question { display: grid; gap: 20px; }
.question .title { font-size: var(--t-title); max-width: 820px; }
.question .title em { font-style: normal; color: var(--accent); }

/* 하는 일 카드 */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
@media (max-width: 860px) { .cards { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow); padding: 24px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.tag { justify-self: start; font: 500 var(--t-label)/1 var(--font-body); color: var(--accent); background: var(--accent-soft); padding: 6px 10px; border-radius: 999px; }
.card p { color: var(--muted); }

/* 이유 */
.why { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; }
@media (max-width: 860px) { .why { grid-template-columns: 1fr; gap: 24px; } }
.why > div { display: grid; gap: 8px; border-top: 2px solid var(--fg); padding-top: 16px; min-width: 0; }
.why .word { font-family: var(--font-title); font-size: 28px; line-height: 1.2; }

/* 증거 */
.evidence { display: grid; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 24px; padding-block: 20px; border-bottom: 1px solid var(--line); }
@media (max-width: 640px) { .row { grid-template-columns: 1fr; gap: 6px; } }
.row .body { display: grid; gap: 6px; min-width: 0; }
.row .src { font-size: var(--t-label); color: var(--muted); }

/* FAQ */
.faq { display: grid; gap: 40px; max-width: 760px; }
.faq article { display: grid; gap: 10px; }
.faq .answer { font-weight: 500; }
.faq .more { color: var(--muted); }

/* 함께하기 */
.contact { display: grid; gap: 20px; }
.contact .title { font-size: var(--t-title); }
footer { padding-block: 32px 48px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }

@media (prefers-reduced-motion: no-preference) {
  .hero > * { animation: rise .6s ease both; }
  .hero > *:nth-child(2) { animation-delay: .06s; }
  .hero > *:nth-child(3) { animation-delay: .12s; }
  .hero > *:nth-child(4) { animation-delay: .18s; }
  @keyframes rise { from { transform: translateY(8px); } to { transform: none; } }
}
</style>
<style>
.post{max-width:720px;padding-block:56px 72px;display:grid;gap:18px}
.post h1{font-size:clamp(30px,6vw,48px)}
.post h2{margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.post h3{margin-top:12px}
.post .lead{font-size:18px;color:var(--muted)}
.post ul,.post ol{margin:0;padding-left:22px;display:grid;gap:8px}
.tablewrap{overflow-x:auto}
.post table{border-collapse:collapse;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card)}
.post th,.post td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
.post th{font-size:var(--t-label);color:var(--muted);font-weight:500}
.back{display:inline-block;margin-top:8px}
</style>
<style>
.nl-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:20px 22px;display:grid;gap:8px}
.nl-item h3{margin:0}
.nl-item p,.nl-tip{display:block;margin:0}
.nl-tip{margin-top:16px}
.nl-item .why{color:var(--fg)}
.nl-item .src{font-size:var(--t-label);color:var(--muted)}
.nl-tip{border-left:4px solid var(--accent);padding:12px 16px;background:var(--accent-soft);border-radius:8px}
.nl-archive{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0}
.nl-archive a{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:999px;text-decoration:none}
.nl-archive a[aria-current]{border-color:var(--accent);color:var(--accent)}
</style>
</head><body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/">남상욱 교수</a>
    <nav class="nav" aria-label="이동"><a href="/">홈</a><a href="/blog/">블로그</a><a href="/newsletter/">뉴스레터</a></nav>
  </header>
  <main>
<article class="post">
  <p class="label">뉴스레터 · 매일 아침 8시 발행</p>
  <h1 id="nl-title">AI·진로 브리핑</h1>
  <p class="lead" id="nl-intro">대학생과 취업준비생이 알아 두면 좋은 AI, 채용, 산학협력 소식을 매일 아침 짧게 정리합니다.</p>
  <div id="nl-body"><p>불러오는 중입니다...</p></div>
  <h2>지난 뉴스레터</h2>
  <ul class="nl-archive" id="nl-archive"></ul>
</article>
  </main>
  <footer>
    <p class="label">남상욱 교수 · 한국기술교육대학교 IPP센터 산학협력 교수</p>
    <p class="label">매일 오전 8시 발행</p>
  </footer>
</div>
<script>
// 뉴스레터 호는 GitHub 저장소의 newsletter/issues/YYYY-MM-DD.json 에 저장되고, 이 페이지가 바로 읽어 옵니다(사이트 재배포 불필요).
(function () {
  var REPO = 'namu9400-arch/nam-homepage';
  var LIST = 'https://api.github.com/repos/' + REPO + '/contents/newsletter/issues?ref=main';
  var RAW = 'https://raw.githubusercontent.com/' + REPO + '/main/newsletter/issues/';
  var body = document.getElementById('nl-body');
  var archive = document.getElementById('nl-archive');
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function dot(d) { return d.replace(/-/g, '.'); }
  function safeUrl(u) { return /^https?:\/\//.test(u || '') ? u : null; }
  function render(issue) {
    document.getElementById('nl-title').textContent = issue.title || 'AI·진로 브리핑';
    document.getElementById('nl-intro').textContent = dot(issue.date) + ' · ' + (issue.intro || '');
    document.title = (issue.title || 'AI·진로 브리핑') + ' | 남상욱 교수 뉴스레터';
    body.innerHTML = '';
    var wrap = el('div'); wrap.style.display = 'grid'; wrap.style.gap = '14px';
    (issue.items || []).forEach(function (it, i) {
      var card = el('section', 'nl-item');
      card.appendChild(el('span', 'tag', (i + 1) + ' · ' + (it.category || '소식')));
      card.appendChild(el('h3', null, it.title || ''));
      if (it.summary) card.appendChild(el('p', null, it.summary));
      if (it.why) { var w = el('p', 'why'); var b = el('strong', null, '학생에게 주는 의미: '); w.appendChild(b); w.appendChild(document.createTextNode(it.why)); card.appendChild(w); }
      var u = safeUrl(it.url);
      if (u) { var s = el('p', 'src'); s.appendChild(document.createTextNode('출처: ')); var a = el('a', null, it.source || u); a.href = u; a.target = '_blank'; a.rel = 'noopener'; s.appendChild(a); card.appendChild(s); }
      wrap.appendChild(card);
    });
    body.appendChild(wrap);
    if (issue.tip) { var t = el('p', 'nl-tip'); t.appendChild(el('strong', null, '오늘의 실천 한 가지: ')); t.appendChild(document.createTextNode(issue.tip)); body.appendChild(t); }
  }
  function empty(msg) { body.innerHTML = ''; body.appendChild(el('p', null, msg)); }
  fetch(LIST).then(function (r) { if (r.status === 404) return []; if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (files) {
      var dates = files.filter(function (f) { return /^\d{4}-\d{2}-\d{2}\.json$/.test(f.name); }).map(function (f) { return f.name.slice(0, 10); }).sort().reverse();
      if (!dates.length) { empty('첫 뉴스레터는 곧 오전 8시에 발행됩니다.'); return; }
      var want = new URLSearchParams(location.search).get('d');
      var cur = dates.indexOf(want) >= 0 ? want : dates[0];
      dates.forEach(function (d) { var li = el('li'); var a = el('a', null, dot(d)); a.href = '?d=' + d; if (d === cur) a.setAttribute('aria-current', 'page'); li.appendChild(a); archive.appendChild(li); });
      return fetch(RAW + cur + '.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(render);
    })
    .catch(function () { empty('뉴스레터를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'); });
})();
</script>
</body></html>
